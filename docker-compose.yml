services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: geodhara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geodhara_user
      POSTGRES_PASSWORD: geodhara_secret_password
      POSTGRES_DB: geodhara_db
    ports:
      - "5432:5432"
    volumes:
      - geodhara_pg_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geodhara_user -d geodhara_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: geodhara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - geodhara_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: geodhara-api
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://geodhara_user:geodhara_secret_password@postgres:5432/geodhara_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: geodhara_sih_2026_super_secure_jwt_token_secret_key_99182
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: geodhara-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  geodhara_pg_data:
  geodhara_redis_data:
